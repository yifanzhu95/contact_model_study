[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contact_study"
version = "0.1.0"
description = "Systematic study of contact model fidelity for sampling-based MPC in dexterous manipulation"
requires-python = ">=3.10"

dependencies = [
    # One env for M1-M6 on MuJoCo 3.14, which M6 (ComFree-Sim) needs. M1, M2
    # and M4 run on the standalone mujoco-warp. M3's comfree_warp 0.1 is
    # installed renamed, as comfree_warp_v1, because M6 took the comfree_warp
    # name: asu-iris/comfree_warp@ba8b996 plus a sensor.py fix for Warp >= 1.16
    # and a MULTICCD fix for MuJoCo 3.14, on this repo's `comfree-warp-v1`
    # branch (a standalone branch off the comfree history; never merge it into
    # the study branches). M6's own comfree_warp 0.3 is private and pins Warp
    # 1.15, so it is installed by hand with --no-deps (README.md).
    "mujoco==3.14.0",
    "mujoco-warp==3.14.0",
    "warp-lang>=1.15,<1.18",
    "comfree_warp_v1 @ git+https://github.com/yifanzhu95/contact_model_study.git@54499a758689ebdda321001031c87ca84030c665",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "scikit-optimize>=0.9",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]
# M5 (Kamino, ContactModelStudy/Simulators/Kamino.py): Newton's SolverKamino.
# Needs Python >= 3.11 (Newton's Kamino code does not import on 3.10) and
# exactly Warp 1.17 (the Kamino reference measured 1.18 as much slower). The
# `contact_kamino` conda env is built this way; see ContactModelStudy/README.md.
kamino = [
    "newton==1.6.0",
    "warp-lang==1.17.0",
    "trimesh",
    "fast-simplification",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ContactModelStudy*"]

[tool.ruff]
line-length = 100
