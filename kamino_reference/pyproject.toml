[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kamino-feasibility"
version = "0.1.0"
description = "Isolated feasibility study for Newton SolverKamino and sampling-based MPC"
requires-python = ">=3.12,<3.13"
dependencies = [
    "newton[examples]==1.6.0",
    "warp-lang==1.17.0",
    "numpy>=2,<3",
    "mujoco==3.12.0",
    "mujoco-warp==3.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
